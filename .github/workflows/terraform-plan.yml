###############################################################################
# Terraform Plan - PR 생성/업데이트 시 자동 실행
# Plan 결과를 PR 코멘트로 남겨 리뷰어가 변경사항 확인 가능
###############################################################################

name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'

env:
  AWS_REGION: ap-northeast-2
  TF_VERSION: '1.5.7'

permissions:
  contents: read
  pull-requests: write
  id-token: write  # OIDC for AWS authentication

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      landing-zone: ${{ steps.filter.outputs.landing-zone }}
      service: ${{ steps.filter.outputs.service }}
      operations: ${{ steps.filter.outputs.operations }}
      modules: ${{ steps.filter.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            landing-zone:
              - 'infra/terraform/landing-zone/**'
              - 'infra/terraform/modules/**'
            service:
              - 'infra/terraform/service/**'
              - 'infra/terraform/modules/**'
            operations:
              - 'infra/terraform/operations/**'
              - 'infra/terraform/modules/**'
            modules:
              - 'infra/terraform/modules/**'

  plan-landing-zone:
    name: Plan (Landing Zone)
    needs: detect-changes
    if: needs.detect-changes.outputs.landing-zone == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_LANDING_ZONE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra/terraform/landing-zone
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: infra/terraform/landing-zone
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform/landing-zone
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "plan_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comment PR - Landing Zone
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/landing-zone/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;

            const body = `### 🏗️ Terraform Plan — Landing Zone

            <details>
            <summary>Plan Output (click to expand)</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            **Status:** ${{ steps.plan.outcome == 'success' && '✅ Plan succeeded' || '❌ Plan failed' }}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  plan-service:
    name: Plan (Service)
    needs: detect-changes
    if: needs.detect-changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_SERVICE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra/terraform/service
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: infra/terraform/service
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform/service
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment PR - Service
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/service/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;

            const body = `### 🏗️ Terraform Plan — Service

            <details>
            <summary>Plan Output (click to expand)</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            **Status:** ${{ steps.plan.outcome == 'success' && '✅ Plan succeeded' || '❌ Plan failed' }}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  plan-operations:
    name: Plan (Operations)
    needs: detect-changes
    if: needs.detect-changes.outputs.operations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_OPERATIONS }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra/terraform/operations
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: infra/terraform/operations
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform/operations
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment PR - Operations
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/operations/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;

            const body = `### 🏗️ Terraform Plan — Operations

            <details>
            <summary>Plan Output (click to expand)</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            **Status:** ${{ steps.plan.outcome == 'success' && '✅ Plan succeeded' || '❌ Plan failed' }}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
