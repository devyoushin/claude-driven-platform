###############################################################################
# ServiceMonitor - Service Account EKS 워크로드 메트릭 수집
# Operations 클러스터의 Prometheus가 Service 클러스터를 스크래핑
###############################################################################

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: service-eks-workloads
  namespace: monitoring
  labels:
    app: prometheus
    release: kube-prometheus-stack
    component: service-account
spec:
  # Service Account EKS의 메트릭 엔드포인트
  # TGW를 통해 cross-VPC scraping
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
        - targetLabel: cluster
          replacement: cdp-service-eks
        - targetLabel: account
          replacement: service
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/monitored-by: prometheus
