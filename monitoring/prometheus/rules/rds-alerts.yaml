###############################################################################
# PrometheusRule - RDS (PostgreSQL) 알람 규칙
# postgres_exporter 메트릭 기반
###############################################################################

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rds-alerts
  namespace: monitoring
  labels:
    app: prometheus
    release: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    ###########################################################################
    # RDS Connection Alerts
    ###########################################################################
    - name: rds.connections
      rules:
        # 연결 수 80% 도달 (max_connections 기준)
        - alert: RDSConnectionsHigh
          expr: |
            pg_stat_activity_count / on() pg_settings_max_connections * 100 > 80
          for: 5m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "RDS 연결 수 높음 ({{ $labels.db_instance }})"
            description: "{{ $labels.db_instance }}의 활성 연결이 max_connections의 {{ $value | printf \"%.0f\" }}%입니다."

        # 연결 수 95% - Critical
        - alert: RDSConnectionsCritical
          expr: |
            pg_stat_activity_count / on() pg_settings_max_connections * 100 > 95
          for: 2m
          labels:
            severity: critical
            component: database
          annotations:
            summary: "RDS 연결 포화 ({{ $labels.db_instance }})"
            description: "{{ $labels.db_instance }}의 연결이 거의 포화 상태입니다. 즉시 조치 필요."

    ###########################################################################
    # RDS Performance Alerts
    ###########################################################################
    - name: rds.performance
      rules:
        # Slow queries 증가
        - alert: RDSSlowQueries
          expr: |
            rate(pg_stat_activity_max_tx_duration{state="active"}[5m]) > 30
          for: 5m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "RDS 슬로우 쿼리 ({{ $labels.db_instance }})"
            description: "30초 이상 실행 중인 쿼리가 감지되었습니다."

        # Deadlock 발생
        - alert: RDSDeadlocks
          expr: |
            increase(pg_stat_database_deadlocks[5m]) > 0
          for: 0m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "RDS Deadlock 발생 ({{ $labels.datname }})"
            description: "{{ $labels.datname }} 데이터베이스에서 deadlock이 감지되었습니다."

        # Replication lag (read replica 사용 시)
        - alert: RDSReplicationLag
          expr: |
            pg_replication_lag > 30
          for: 5m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "RDS Replication Lag ({{ $labels.db_instance }})"
            description: "Replication lag이 {{ $value | printf \"%.0f\" }}초입니다."

    ###########################################################################
    # RDS Storage Alerts
    ###########################################################################
    - name: rds.storage
      rules:
        # 테이블 bloat (dead tuple 비율)
        - alert: RDSTableBloat
          expr: |
            pg_stat_user_tables_n_dead_tup / (pg_stat_user_tables_n_live_tup + pg_stat_user_tables_n_dead_tup + 1) * 100 > 30
          for: 30m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "테이블 Bloat 높음 ({{ $labels.relname }})"
            description: "{{ $labels.relname }} 테이블의 dead tuple 비율이 {{ $value | printf \"%.0f\" }}%입니다. VACUUM 필요."

        # Cache hit ratio 낮음
        - alert: RDSLowCacheHitRatio
          expr: |
            pg_stat_database_blks_hit / (pg_stat_database_blks_hit + pg_stat_database_blks_read + 1) * 100 < 90
          for: 15m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "RDS Cache Hit Ratio 낮음 ({{ $labels.datname }})"
            description: "{{ $labels.datname }}의 cache hit ratio가 {{ $value | printf \"%.1f\" }}%입니다. 메모리 증설 또는 쿼리 최적화 필요."

    ###########################################################################
    # RDS Availability
    ###########################################################################
    - name: rds.availability
      rules:
        # RDS Exporter 다운
        - alert: RDSExporterDown
          expr: up{job="rds-exporter"} == 0
          for: 3m
          labels:
            severity: critical
            component: database
          annotations:
            summary: "RDS Exporter 다운"
            description: "RDS Exporter가 3분 이상 응답하지 않습니다. RDS 연결 또는 exporter pod 상태 확인 필요."
