services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cdpdb
      POSTGRES_USER: cdpadmin
      POSTGRES_PASSWORD: localdev123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdpadmin -d cdpdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  crypto-price-api:
    build:
      context: ./apps/crypto-price-api
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      METRICS_PORT: "9090"
      DATABASE_URL: "postgres://cdpadmin:localdev123@postgres:5432/cdpdb?sslmode=disable"
      FETCH_INTERVAL: "30s"
    ports:
      - "8080:8080"
      - "9091:9090"
    depends_on:
      postgres:
        condition: service_healthy

  crypto-alert-service:
    build:
      context: ./apps/crypto-alert-service
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://cdpadmin:localdev123@postgres:5432/cdpdb"
      PRICE_API_URL: "http://crypto-price-api:8080"
      EVALUATION_INTERVAL: "60"
      SNS_TOPIC_ARN: "arn:aws:sns:ap-northeast-2:000000000000:local-alerts"
      AWS_DEFAULT_REGION: "ap-northeast-2"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      crypto-price-api:
        condition: service_started

volumes:
  pgdata:
